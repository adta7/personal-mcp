name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Typecheck and lint are cheap; the build is where content validation fails.
      # Malformed content/ must break CI here rather than reach production.
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
